{% extends "shelter/base.html" %}

{% block title %}Delete {{ object.name }} - Pet Shelter{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-body text-center p-4">
                    <h3 class="text-danger fw-bold mb-3">⚠️ Are you sure?</h3>
                    <p class="fs-5 text-muted mb-4">You are about to permanently remove
                        <strong>{{ object.name }}</strong> from the shelter database. This action cannot be undone.</p>

                    <form action="" method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'shelter:pet-detail' pk=object.pk %}"
                               class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger fw-bold px-4">Yes, Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
